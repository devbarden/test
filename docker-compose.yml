services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alt_shift
      POSTGRES_PASSWORD: alt_shift
      POSTGRES_USER: alt_shift
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alt_shift -d alt_shift']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '6380:6379'

volumes:
  postgres-data:
